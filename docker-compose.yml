services:
  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: web/frontend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./web/frontend/app:/app/app
      - ./web/frontend/components:/app/components
      - ./web/frontend/hooks:/app/hooks
      - ./web/frontend/lib:/app/lib
      - node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  node_modules:
